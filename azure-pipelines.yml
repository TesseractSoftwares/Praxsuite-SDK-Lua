# Praxsuite SDK for Lua - validate, package, and mirror to GitHub
#
# Mirrors the Unity SDK's model so both SDKs work the same way: Azure DevOps is the source of
# truth, and master publishes to the public GitHub repo.
#
# PR and development: validate only.
# master:             validate, build the Rojo model, mirror the source to GitHub, and cut a
#                     GitHub Release carrying the .rbxm.
#
# Note this repo previously lived on GitHub alone, with GitHub Actions as its only CI and
# releases cut from tag pushes. That workflow still exists at .github/workflows/ and is left in
# place so a fork or a direct GitHub contributor still gets checks - it is simply no longer the
# release path.

trigger:
  branches:
    include:
      - master
      - development
  paths:
    exclude:
      - README.md
      - CHANGELOG.md
      - docs/*

pr:
  branches:
    include:
      - master
      - development

pool:
  name: tesseract-buildpool

variables:
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  githubRepo: 'TesseractSoftwares/Praxsuite-SDK-Lua'

stages:

# ─────────────────────────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Lint and build'
  jobs:
    - job: Validate
      steps:
        # Install the tool versions aftman.toml pins, so CI runs what a developer runs.
        #
        # Written out per tool rather than through one shared URL pattern, because the three
        # projects name their release assets three different ways and two of them do not match
        # any guess:
        #   rojo    v7.4.4  -> rojo-7.4.4-linux-x86_64.zip     (version in the name)
        #   selene  0.27.1  -> selene-0.27.1-linux.zip         (NO leading v on the tag)
        #   stylua  v0.20.0 -> stylua-linux-x86_64.zip         (no version in the name at all)
        # All three URLs were confirmed to return 200 before this was committed. An earlier
        # attempt used aftman, whose installer URL does not exist, and then one uniform pattern,
        # which was wrong for selene and stylua.
        #
        # No `set -e` here on purpose: the linters are advisory, so a failed download must not
        # abort the step. Rojo is checked explicitly instead.
        - script: |
            mkdir -p "$HOME/bin"
            ROJO_V=$(grep -m1 '^rojo *=' aftman.toml | cut -d'@' -f2 | tr -d '"')
            SELENE_V=$(grep -m1 '^selene *=' aftman.toml | cut -d'@' -f2 | tr -d '"')
            STYLUA_V=$(grep -m1 '^stylua *=' aftman.toml | cut -d'@' -f2 | tr -d '"')
            echo "pinned: rojo=$ROJO_V selene=$SELENE_V stylua=$STYLUA_V"

            fetch() {
              echo "  $1"
              curl -fsSL "$1" -o "/tmp/tool.zip" && unzip -oq /tmp/tool.zip -d "$HOME/bin"
            }

            fetch "https://github.com/rojo-rbx/rojo/releases/download/v$ROJO_V/rojo-$ROJO_V-linux-x86_64.zip"               || { echo "##vso[task.logissue type=error]Could not install Rojo $ROJO_V - the build cannot proceed without it."; exit 1; }

            fetch "https://github.com/Kampfkarren/selene/releases/download/$SELENE_V/selene-$SELENE_V-linux.zip"               || echo "selene unavailable - lint will be skipped"

            fetch "https://github.com/JohnnyMorganz/StyLua/releases/download/v$STYLUA_V/stylua-linux-x86_64.zip"               || echo "stylua unavailable - format check will be skipped"

            chmod +x "$HOME/bin"/* 2>/dev/null
            echo "##vso[task.prependpath]$HOME/bin"
            ls -la "$HOME/bin"
            "$HOME/bin/rojo" --version
          displayName: 'Install Rojo, Selene, StyLua (pinned)'

        - script: command -v stylua >/dev/null && stylua --check src/ || echo "stylua not installed - skipped"
          displayName: 'StyLua (formatting)'
          continueOnError: true

        - script: command -v selene >/dev/null && selene src/ || echo "selene not installed - skipped"
          displayName: 'Selene (lint)'
          continueOnError: true

        # The build is the real gate: a Lua syntax error or a broken project file fails here.
        - script: |
            set -e
            rojo build default.project.json -o praxsuite-sdk.rbxm
            test -s praxsuite-sdk.rbxm
            echo "Built $(du -h praxsuite-sdk.rbxm | cut -f1)"
          displayName: 'Rojo build'

        - publish: praxsuite-sdk.rbxm
          artifact: rbxm
          displayName: 'Publish model artifact'

        # This repo is mirrored to a PUBLIC GitHub repo, so hold it to the same standard as the
        # Unity SDK: no secret keys, and no real workspace identifiers. A workspace GUID is not
        # cosmetic - /auth/config is unauthenticated, so the GUID alone is enough to fetch that
        # workspace's publishable key. One was found committed in docs/ and scrubbed.
        - script: |
            set -e
            if grep -rEn 'sk_live_[A-Za-z0-9]{16,}' --include='*.lua' --include='*.md' \
                 --include='*.toml' --include='*.json' --include='*.yml' \
                 --exclude-dir=.git . ; then
              echo "##vso[task.logissue type=error]A Praxsuite secret key is present. Revoke it now - this repo is mirrored publicly."
              exit 1
            fi
            echo "No secret keys found."
          displayName: 'Scan for leaked secret keys'

# ─────────────────────────────────────────────────────────────────────────────
- stage: Publish
  displayName: 'Mirror to GitHub'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables.isMaster, true))
  jobs:
    - job: Publish
      steps:
        # Full history: the mirror push needs real commits, not a shallow clone.
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - task: AzureKeyVault@2
          displayName: 'Read GitHub token'
          inputs:
            azureSubscription: 'sc-acr-push-core-prod'
            KeyVaultName: 'prax-cicd-kv'
            SecretsFilter: 'GITHUB-SDK-MIRROR-TOKEN'
            RunAsPreJob: false

        - download: current
          artifact: rbxm

        # wally.toml is the version source of truth, so a release cannot disagree with what
        # the package manager reports.
        - script: |
            set -e
            VERSION=$(grep -m1 '^version' wally.toml | sed 's/.*= *"\(.*\)"/\1/')
            if [ -z "$VERSION" ]; then
              echo "##vso[task.logissue type=error]wally.toml has no version field."
              exit 1
            fi
            echo "Package version: $VERSION"
            echo "##vso[task.setvariable variable=pkgVersion]$VERSION"
          displayName: 'Read package version'

        # --force-with-lease, not --force: if someone pushed to GitHub directly, fail loudly
        # rather than destroy their commit. This repo had GitHub as its origin for months, so
        # direct pushes are a real possibility here in a way they are not for the Unity SDK.
        - script: |
            set -e
            git config user.email "ci@tesseractsoftwares.com"
            git config user.name  "Tesseract CI"

            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:$(GITHUB-SDK-MIRROR-TOKEN)@github.com/$(githubRepo).git"
            git fetch github master || true

            echo "Mirroring master to github.com/$(githubRepo)"
            if ! git push github HEAD:refs/heads/master --force-with-lease; then
              echo "##vso[task.logissue type=error]Mirror push rejected: GitHub has commits this repo does not. Reconcile them rather than forcing."
              exit 1
            fi
            echo "Mirror complete."
          displayName: 'Mirror source to GitHub'

        # Idempotent: an existing tag is a no-op, so re-running a build never fails.
        - script: |
            set -e
            TAG="v$(pkgVersion)"
            API="https://api.github.com/repos/$(githubRepo)"
            AUTH="Authorization: Bearer $(GITHUB-SDK-MIRROR-TOKEN)"

            if curl -sf -H "$AUTH" "$API/releases/tags/$TAG" >/dev/null; then
              echo "Release $TAG already exists - nothing to publish."
              exit 0
            fi

            # The notes carry no double quotes and no newlines. The previous version escaped
            # quotes inside NOTES, the shell turned them into real quotes, and the request body
            # stopped being valid JSON - GitHub answered 400 and curl exited 22 with the release
            # never created.
            NOTES="Add PraxsuiteSDK = tesseract/praxsuite-sdk@$(pkgVersion) to your wally.toml, or drop the attached .rbxm into ServerScriptService. See CHANGELOG.md for what changed."
            RELEASE=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/releases"               -d "{\"tag_name\":\"$TAG\",\"name\":\"Praxsuite SDK for Lua $(pkgVersion)\",\"body\":\"$NOTES\",\"draft\":false,\"prerelease\":false}")

            RELEASE_ID=$(echo "$RELEASE" | grep -o '"id": *[0-9]*' | head -1 | tr -dc '0-9')
            if [ -z "$RELEASE_ID" ]; then
              echo "##vso[task.logissue type=error]Could not read the release id from the GitHub response."
              exit 1
            fi

            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream"               --data-binary @"$(Pipeline.Workspace)/rbxm/praxsuite-sdk.rbxm"               "https://uploads.github.com/repos/$(githubRepo)/releases/$RELEASE_ID/assets?name=PraxsuiteSDK.rbxm" >/dev/null

            # Verify rather than trust: a release that exists with nothing attached is worse than
            # a failed build, because the pipeline reports success and nobody looks again.
            ASSETS=$(curl -sf -H "$AUTH" "$API/releases/tags/$TAG" | grep -c '"state": *"uploaded"' || true)
            if [ "$ASSETS" -lt 1 ]; then
              echo "##vso[task.logissue type=error]Release $TAG was created but no asset attached."
              exit 1
            fi

            echo "Published release $TAG with $ASSETS asset(s)"
          displayName: 'Cut GitHub release'
